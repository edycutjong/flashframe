[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "flashframe"
version = "1.1.0"
description = "Photosensitivity hazard detector"
dependencies = [
    "click",
    "pydantic",
    "google-genai",
    "python-dotenv",
    "mypy",
]

[tool.ruff]
line-length = 320

[tool.ruff.lint]
select = ["E", "F"]

[project.scripts]
flashframe = "flashframe.cli:cli"

[tool.mypy]
files = ["src/flashframe", "web.py"]
ignore_missing_imports = true
explicit_package_bases = true
