name: Dependency Audit

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install pip-audit
        run: pip install pip-audit

      # Documented ignores for pip-audit
      #
      # PYSEC-2026-2475: fastmcp 2.14.7. Fix available: 3.2.0.
      # Transitive dependency arriving via mcp / mcp-clickhouse.
      # Accepted because: Moving fastmcp to 3.2.0 days before the deadline risks breaking the MCP toolset the entire product runs on, to fix a vulnerability in a package the product never calls directly.
      #
      # PYSEC-2026-2476: fastmcp 2.14.7. Fix available: 3.2.0.
      # Transitive dependency arriving via mcp / mcp-clickhouse.
      # Accepted because: Moving fastmcp to 3.2.0 days before the deadline risks breaking the MCP toolset the entire product runs on, to fix a vulnerability in a package the product never calls directly.
      #
      # PYSEC-2026-2447: diskcache 5.6.3. Fix available: none published.
      # Transitive dependency arriving via mcp / mcp-clickhouse.
      # Accepted because: diskcache PYSEC-2026-2447 has no published fix version to move to at all.
      - name: Run pip-audit
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-2475 --ignore-vuln PYSEC-2026-2476 --ignore-vuln PYSEC-2026-2447
