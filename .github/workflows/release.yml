name: release

# The version in pyproject.toml is the single source of truth.
# Bump it in a normal commit; on push to main this workflow creates the matching
# vMAJOR.MINOR.PATCH tag and a GitHub Release. It never commits anything back, so
# main's commit history stays exactly as authored.
# Pushing a tag does not re-trigger this workflow: the push trigger is filtered to
# the main branch, and a tag ref does not match it.

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history and tags — we test whether the tag exists

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Read version from pyproject.toml
        id: ver
        run: |
          set -euo pipefail
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if ! echo "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::pyproject version '$VERSION' is not MAJOR.MINOR.PATCH"
            exit 1
          fi
          TAG="v$VERSION"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            echo "Tag $TAG already exists — version unchanged, nothing to release."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION has no tag yet — releasing $TAG."
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Tag and publish the release
        if: steps.ver.outputs.skip == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.ver.outputs.tag }}" -m "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"
          gh release create "${{ steps.ver.outputs.tag }}" \
            --generate-notes --title "${{ steps.ver.outputs.tag }}"
