<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="win-grad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A94A6" stop-opacity="0" />
      <stop offset="95%" stop-color="#8A94A6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8A94A6" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .bg { fill: none; stroke: #8A94A6; stroke-width: 12; opacity: 0.2; }
    .grid { stroke: #8A94A6; stroke-width: 2; stroke-dasharray: 8 8; opacity: 0.2; }
    .trace { fill: none; stroke: #8A94A6; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    .trace-amber { fill: none; stroke: #F0B429; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
    
    @keyframes sweep {
      0% { transform: translateX(-250px); }
      100% { transform: translateX(550px); }
    }
    
    @keyframes illuminate {
      0%, 25% { opacity: 0; }
      50%, 70% { opacity: 1; }
      95%, 100% { opacity: 0; }
    }

    .scanner {
      animation: sweep 8s linear infinite;
    }
    .flagged {
      animation: illuminate 8s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .scanner {
        animation: none;
        transform: translateX(120px);
      }
      .flagged {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <rect class="bg" x="32" y="32" width="448" height="448" rx="64" />
  
  <line class="grid" x1="64" y1="170" x2="448" y2="170" />
  <line class="grid" x1="64" y1="256" x2="448" y2="256" />
  <line class="grid" x1="64" y1="342" x2="448" y2="342" />
  
  <path class="trace" d="M 64 256 L 140 256 L 170 170 L 210 340 L 250 170 L 290 340 L 320 256 L 448 256" />
  <path class="trace-amber flagged" d="M 140 256 L 170 170 L 210 340 L 250 170 L 290 340 L 320 256" />
  
  <g class="scanner">
    <rect x="0" y="64" width="200" height="384" fill="url(#win-grad)" />
    <line x1="200" y1="64" x2="200" y2="448" stroke="#8A94A6" stroke-width="2" opacity="0.4" />
  </g>
</svg>
