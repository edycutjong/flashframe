<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400">
  <defs>
    <linearGradient id="win-grad-hero" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#8A94A6" stop-opacity="0" />
      <stop offset="95%" stop-color="#8A94A6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#8A94A6" stop-opacity="0" />
    </linearGradient>
  </defs>
  <style>
    .grid { stroke: #8A94A6; stroke-width: 2; stroke-dasharray: 8 8; opacity: 0.2; }
    .threshold { stroke: #FF4D4D; stroke-width: 2; stroke-dasharray: 8 8; opacity: 0.5; }
    .trace { fill: none; stroke: #8A94A6; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .trace-amber { fill: none; stroke: #F0B429; stroke-width: 8; stroke-linecap: round; stroke-linejoin: round; }
    .wordmark { fill: none; stroke: #8A94A6; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    .subtitle { fill: none; stroke: #8A94A6; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
    
    @keyframes sweep {
      0% { transform: translateX(-450px); }
      100% { transform: translateX(1350px); }
    }
    
    @keyframes illuminate {
      0%, 25% { opacity: 0; }
      42%, 67% { opacity: 1; }
      84%, 100% { opacity: 0; }
    }

    .scanner {
      animation: sweep 12s linear infinite;
    }
    .flagged {
      animation: illuminate 12s linear infinite;
    }

    @media (prefers-reduced-motion: reduce) {
      .scanner {
        animation: none;
        transform: translateX(360px);
      }
      .flagged {
        animation: none;
        opacity: 1;
      }
    }
  </style>

  <!-- Wordmark FLASHFRAME -->
  <path class="wordmark" d="M 80,160 L 80,60 L 140,60 M 80,110 L 120,110 M 160,60 L 160,160 L 220,160 M 240,160 L 240,90 L 260,60 L 280,60 L 300,90 L 300,160 M 240,120 L 300,120 M 380,60 L 320,60 L 320,110 L 380,110 L 380,160 L 320,160 M 400,60 L 400,160 M 460,60 L 460,160 M 400,110 L 460,110 M 480,160 L 480,60 L 540,60 M 480,110 L 520,110 M 560,160 L 560,60 L 620,60 L 620,110 L 560,110 M 560,110 L 620,160 M 640,160 L 640,90 L 660,60 L 680,60 L 700,90 L 700,160 M 640,120 L 700,120 M 720,160 L 720,60 L 750,100 L 780,60 L 780,160 M 860,60 L 800,60 L 800,160 L 860,160 M 800,110 L 840,110" />

  <!-- Subtitle PHOTOSENSITIVITY SCREENER -->
  <path class="subtitle" d="M 85,210 L 85,180 L 103,180 L 103,195 L 85,195 M 109,180 L 109,210 M 127,180 L 127,210 M 109,195 L 127,195 M 133,186 L 139,180 L 145,180 L 151,186 L 151,204 L 145,210 L 139,210 L 133,204 Z M 157,180 L 175,180 M 166,180 L 166,210 M 181,186 L 187,180 L 193,180 L 199,186 L 199,204 L 193,210 L 187,210 L 181,204 Z M 223,189 L 223,180 L 205,180 L 205,195 L 223,195 L 223,210 L 205,210 L 205,201 M 247,180 L 229,180 L 229,210 L 247,210 M 229,195 L 241,195 M 253,210 L 253,180 L 271,210 L 271,180 M 295,189 L 295,180 L 277,180 L 277,195 L 295,195 L 295,210 L 277,210 L 277,201 M 301,180 L 301,210 M 307,180 L 325,180 M 316,180 L 316,210 M 331,180 L 331,210 M 337,180 L 346,210 L 355,180 M 361,180 L 361,210 M 367,180 L 385,180 M 376,180 L 376,210 M 391,180 L 400,195 L 400,210 M 409,180 L 400,195 M 451,189 L 451,180 L 433,180 L 433,195 L 451,195 L 451,210 L 433,210 L 433,201 M 475,189 L 475,180 L 463,180 L 457,186 L 457,204 L 463,210 L 475,210 L 475,201 M 481,210 L 481,180 L 499,180 L 499,195 L 481,195 M 490,195 L 499,210 M 523,180 L 505,180 L 505,210 L 523,210 M 505,195 L 517,195 M 547,180 L 529,180 L 529,210 L 547,210 M 529,195 L 541,195 M 553,210 L 553,180 L 571,210 L 571,180 M 595,180 L 577,180 L 577,210 L 595,210 M 577,195 L 589,195 M 601,210 L 601,180 L 619,180 L 619,195 L 601,195 M 610,195 L 619,210" />

  <!-- Base grid lines -->
  <line class="grid" x1="0" y1="300" x2="1280" y2="300" />
  <line class="grid" x1="0" y1="370" x2="1280" y2="370" />
  
  <!-- Threshold line (Rule limit) -->
  <line class="threshold" x1="0" y1="270" x2="1280" y2="270" />

  <!-- The underlying Trace -->
  <path class="trace" d="M 0 340 L 150 340 L 180 325 L 220 370 L 260 320 L 300 340 L 400 340 L 440 280 L 480 375 L 520 270 L 560 375 L 600 260 L 640 375 L 680 270 L 720 375 L 760 340 L 1280 340" />
  
  <!-- Flagged Span that illuminates -->
  <path class="trace-amber flagged" d="M 400 340 L 440 280 L 480 375 L 520 270 L 560 375 L 600 260 L 640 375 L 680 270 L 720 375 L 760 340" />
  
  <!-- Sliding Window -->
  <g class="scanner">
    <rect x="0" y="240" width="400" height="150" fill="url(#win-grad-hero)" />
    <line x1="400" y1="240" x2="400" y2="390" stroke="#8A94A6" stroke-width="2" opacity="0.4" />
  </g>
</svg>
