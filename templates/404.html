<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Not Found - Flashframe</title>
    <meta name="description" content="Screens a cut for photosensitivity hazards against published Ofcom 2.12 / ITU-R BT.1702 criteria. Screening-grade analysis only; does not constitute a certified lab pass.">
    <meta property="og:title" content="Not Found - Flashframe">
    <meta property="og:description" content="Screens a cut for photosensitivity hazards against published Ofcom 2.12 / ITU-R BT.1702 criteria. Screening-grade analysis only; does not constitute a certified lab pass.">
    <meta property="og:url" content="{{ request.url | string | replace('http://', 'https://') }}">
    <meta property="og:site_name" content="Flashframe">
    <meta property="og:image" content="{{ request.base_url | string | replace('http://', 'https://') }}static/og-image.png">
    <meta name="twitter:card" content="summary_large_image">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <h1>Flashframe</h1>
    </header>
    <main class="container">
        <h2>404 &mdash; Not Found</h2>
        <p>
            {% if message %}
                {{ message }}
            {% else %}
                The requested resource could not be found.
            {% endif %}
        </p>
        <p class="mt-2">
            <a href="/" class="btn">Return to start</a>
        </p>
    </main>
</body>
</html>
