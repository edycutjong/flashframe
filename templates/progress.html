<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scanning - Flashframe</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <h1>Flashframe</h1>
    </header>
    <main class="container">
        <h2>Scanning {{ scan_id }}</h2>
        <ul id="stage-list" class="stage-list">
            <li id="stage-Extract" class="stage pending">Extract</li>
            <li id="stage-Ingest" class="stage pending">Ingest</li>
            <li id="stage-Detect" class="stage pending">Detect</li>
            <li id="stage-Adjudicate" class="stage pending">Adjudicate</li>
            <li id="stage-Certify" class="stage pending">Certify</li>
        </ul>
    </main>
    <script>
        const scanId = "{{ scan_id }}";
        const stageList = document.getElementById('stage-list');
        
        let fetchCount = 0;
        let statusInterval;
        let slowQueryTimeout;

        async function pollStatus() {
            try {
                fetchCount++;
                const res = await fetch(`/api/scan/${scanId}/status`);
                const data = await res.json();
                let allDone = true;
                
                // If we get a response, clear the slow query warning timeout
                if (slowQueryTimeout) {
                    clearTimeout(slowQueryTimeout);
                }
                const msgEl = document.getElementById('slow-status');
                if (msgEl) msgEl.style.display = 'none';
                
                data.stages.forEach(stage => {
                    const el = document.getElementById(`stage-${stage.name}`);
                    if (el) {
                        if (stage.status === 'done' && el.classList.contains('pending')) {
                            el.classList.remove('pending');
                            el.classList.add('done');
                            el.innerHTML = `${stage.name} <span class="tick" aria-hidden="true">✓</span>`;
                        }
                        if (stage.status !== 'done') {
                            allDone = false;
                        }
                    }
                });
                
                if (data.status === 'complete' || allDone) {
                    setTimeout(() => {
                        window.location.href = `/report/${scanId}`;
                    }, 500);
                } else {
                    statusInterval = setTimeout(pollStatus, 1000);
                }
            } catch (err) {
                console.error(err);
                statusInterval = setTimeout(pollStatus, 2000);
            }
        }
        
        slowQueryTimeout = setTimeout(() => {
            let msgEl = document.getElementById('slow-status');
            if (!msgEl) {
                msgEl = document.createElement('p');
                msgEl.id = 'slow-status';
                msgEl.style.color = '#ff9800';
                msgEl.textContent = 'Waking the analytics warehouse (ClickHouse Cloud suspends idle services; first query can take ~30s)';
                document.querySelector('main').appendChild(msgEl);
            }
            msgEl.style.display = 'block';
        }, 3000);
        
        pollStatus();
    </script>
</body>
</html>
