<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Scan in Progress - Flashframe</title>
    <meta name="description" content="Screens a cut for photosensitivity hazards against published Ofcom 2.12 / ITU-R BT.1702 criteria. Screening-grade analysis only; does not constitute a certified lab pass.">
    <meta property="og:title" content="Scan in Progress - Flashframe">
    <meta property="og:description" content="Screens a cut for photosensitivity hazards against published Ofcom 2.12 / ITU-R BT.1702 criteria. Screening-grade analysis only; does not constitute a certified lab pass.">
    <meta property="og:url" content="{{ request.url | string | replace('http://', 'https://') }}">
    <meta property="og:site_name" content="Flashframe">
    <meta property="og:image" content="{{ request.base_url | string | replace('http://', 'https://') }}static/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="Flashframe: 6.25 flashes/sec measured against Ofcom 2.12's published 3.00 limit, frames 740-760.">
    <meta property="og:type" content="website">
    <meta name="twitter:card" content="summary_large_image">
        <link rel="icon" type="image/svg+xml" href="/static/icon.svg">
    <link rel="icon" type="image/png" sizes="512x512" href="/static/icon-512.png">
    <link rel="apple-touch-icon" href="/static/icon-512.png">
    <meta name="theme-color" content="#0B0D10">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="app-header">
        <h1>Flashframe</h1>
    </header>
    <main class="container">
        <h2>Scanning {{ scan_id }}</h2>
        <ul id="stage-list" class="stage-list">
            <li id="stage-Extract" class="stage pending">Extract</li>
            <li id="stage-Ingest" class="stage pending">Ingest</li>
            <li id="stage-Detect" class="stage pending">Detect</li>
            <li id="stage-Adjudicate" class="stage pending">Adjudicate</li>
            <li id="stage-Certify" class="stage pending">Certify</li>
        </ul>
    </main>
    <script>
        const scanId = "{{ scan_id }}";
        const stageList = document.getElementById('stage-list');
        
        let fetchCount = 0;
        let statusInterval;
        let slowQueryTimeout;

        async function pollStatus() {
            try {
                fetchCount++;
                const res = await fetch(`/api/scan/${scanId}/status`);
                const data = await res.json();
                let allDone = true;
                
                // If we get a response, clear the slow query warning timeout
                if (slowQueryTimeout) {
                    clearTimeout(slowQueryTimeout);
                }
                const msgEl = document.getElementById('slow-status');
                if (msgEl) msgEl.style.display = 'none';
                
                data.stages.forEach(stage => {
                    const el = document.getElementById(`stage-${stage.name}`);
                    if (el) {
                        if (stage.status === 'done' && el.classList.contains('pending')) {
                            el.classList.remove('pending');
                            el.classList.add('done');
                            el.innerHTML = `${stage.name} <span class="tick" aria-hidden="true">✓</span>`;
                        }
                        if (stage.status !== 'done') {
                            allDone = false;
                        }
                    }
                });
                
                if (data.status === 'error') {
                    stageList.style.display = 'none';
                    const errEl = document.createElement('div');
                    errEl.style.color = 'red';
                    errEl.style.border = '1px solid red';
                    errEl.style.padding = '1rem';
                    errEl.innerHTML = `<h3>Scan Failed</h3><p>${data.error_message}</p><p>Please try again later.</p>`;
                    document.querySelector('main').appendChild(errEl);
                    if (slowQueryTimeout) clearTimeout(slowQueryTimeout);
                    return; // stop polling
                }
                
                if (data.status === 'complete' || allDone) {
                    setTimeout(() => {
                        window.location.href = `/report/${scanId}`;
                    }, 500);
                } else {
                    statusInterval = setTimeout(pollStatus, 1000);
                }
            } catch (err) {
                console.error(err);
                statusInterval = setTimeout(pollStatus, 2000);
            }
        }
        
        slowQueryTimeout = setTimeout(() => {
            let msgEl = document.getElementById('slow-status');
            if (!msgEl) {
                msgEl = document.createElement('p');
                msgEl.id = 'slow-status';
                msgEl.style.color = '#ff9800';
                msgEl.textContent = 'Waking the analytics warehouse (ClickHouse Cloud suspends idle services; first query can take ~30s)';
                document.querySelector('main').appendChild(msgEl);
            }
            msgEl.style.display = 'block';
        }, 3000);
        
        pollStatus();
    </script>
</body>
</html>
