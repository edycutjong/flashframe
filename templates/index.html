<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashframe</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="full-viewport-drop" id="drop-zone-body">
    <header class="app-header">
        <h1>Flashframe</h1>
    </header>
    <main class="container">
        <h2>Screen a cut for photosensitivity violations.</h2>
        <p class="interpretation text-muted">Ofcom 2.12 &middot; ITU-R BT.1702 &middot; NAB Japan &middot; screening-grade, not a certified lab pass.</p>

        <form action="/upload" method="post" enctype="multipart/form-data" id="upload-form">
            <section class="upload-section">
                <input type="file" id="file" name="file" class="file-input">
                <button type="submit" class="btn primary">Scan</button>
            </section>
            
            <section class="seed-clips-section">
                <h3>Seed Clips</h3>
                <div class="seed-clips-grid">
                    <button type="submit" name="seed_clip" value="hard_fail_strobe" class="btn">Strobe Violation (Fail)</button>
                    <button type="submit" name="seed_clip" value="borderline_screen_area" class="btn">Borderline (Pass via resample)</button>
                    <button type="submit" name="seed_clip" value="control_clean" class="btn">Control Clip (Pass)</button>
                </div>
            </section>
        </form>
    </main>

    <script>
        const form = document.getElementById('upload-form');
        form.addEventListener('submit', () => {
            setTimeout(() => {
                form.querySelectorAll('button[type="submit"]').forEach(btn => {
                    btn.disabled = true;
                    if (btn.classList.contains('primary')) {
                        btn.textContent = 'Scanning...';
                    }
                });
            }, 0);
        });

        const dropZone = document.getElementById('drop-zone-body');
        const fileInput = document.getElementById('file');
        
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('drag-over');
        });
        
        dropZone.addEventListener('dragleave', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
        });
        
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('drag-over');
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                fileInput.files = e.dataTransfer.files;
            }
        });
    </script>
</body>
</html>
